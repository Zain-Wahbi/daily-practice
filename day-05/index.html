<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live City Search</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Live City Search</h1>

    <label for="city-input">City name</label>
    <input id="city-input" type="text" placeholder="e.g. Hama" autocomplete="off">

    <p id="status" role="status"></p>
    <ul id="suggestions"></ul>
    <section id="result"></section>
  </main>

  <footer>
    Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>
  </footer>
</body>
</html>
